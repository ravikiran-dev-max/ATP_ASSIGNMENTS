<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Example</title>

    <!-- Linking external CSS file for styling -->
    <link rel="stylesheet" href="idcard.css">
</head>
<body>
    <!-- ID card container -->
    <div class="idcard">
        <!-- Profile image -->
        <img src="https://m.media-amazon.com/images/I/51rayl0HnRL._SY679_.jpg" alt="image">

        <!-- Card heading -->
        <h3>ID CARD</h3>

        <!-- Card details -->
        <p>Name: Luffy</p>
        <p>Course: CSE</p>
        <p>HallTicket: 24XXXXXX04</p>

        <!-- Action button -->
        <button>Show</button>
    </div>
</body>
</html>
