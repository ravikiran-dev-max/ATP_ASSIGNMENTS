<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-7.1</title>

    <!-- Linking external CSS file for styling -->
    <link rel="stylesheet" href="table2.css">
</head>
<body>
    <!-- Main table -->
    <table>
        <!-- Table title row -->
        <tr>
            <th colspan="4">Table</th>
        </tr>

        <!-- Subtitle row -->
        <tr>
            <th colspan="2">Subtitle</th>
            <th colspan="2">Subtitle</th>
        </tr>

        <!-- Data row with multiple items stacked using <br> -->
        <tr>
            <td>
                1 item <br>
                1 item <br>
                1 item
            </td>
            <td>
                123 <br>
                123 <br>
                123
            </td>
            <td>
                1 item <br>
                1 item <br>
                1 item
            </td>
            <td>
                123 <br>
                123 <br>
                123
            </td>
        </tr>

        <!-- Footer subtitle row -->
        <tr>
            <td colspan="2">Subtitle</td>
            <td colspan="2">Subtitle</td>
        </tr>
    </table>
</body>
</html>
