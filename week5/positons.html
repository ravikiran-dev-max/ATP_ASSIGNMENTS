<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <!-- External CSS file for styling -->
    <link rel="stylesheet" href="position.css">
</head>
<body>
    <!-- Main parent card container -->
    <div class="parent">
        
        <!-- Small decorative image positioned at top-right corner of the card -->
        <img class="child1" 
             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOC0qifi9s3RGPEKDoqlAGlc9U8woiKSOoSQ&s" 
             alt="Decorative icon">

        <!-- Circular LinkedIn logo positioned near the bottom of the card -->
        <img class="child2" 
             src="https://img.freepik.com/premium-vector/round-linkedin-logo-isolated-white-background_469489-985.jpg?semt=ais_hybrid&w=740&q=80" 
             alt="LinkedIn logo">

        <!-- Large circular profile image centered inside the card -->
        <img class="img3" 
             src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwTTe6vHiR2cG4aFIfVFAsE-GPx8DVVzKU7g&s" 
             alt="Profile picture">

        <!-- Text content inside the card -->
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, neque?</p>
    </div>
</body>
</html>
