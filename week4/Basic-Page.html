<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Example</title>
</head>
<body>
    <!-- First paragraph -->
    <p>This is my first paragraph Lorem ipsum, dolor sit amet consectetur adipisicing elit...</p>
    
    <!-- Main heading -->
    <h1>Web Pages Are Exciting Too</h1>
    
    <!-- Long descriptive paragraph -->
    <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Autem rem sequi quidem pariatur...
    </p>
    
    <!-- External link -->
    <a href="https://www.google.com">Link to Google</a> 
    
    <!-- Unordered list of items -->
    <ul>
        <li>Apple</li>
        <li>Apple</li>
        <li>Apple</li>
        <li>Apple</li>
        <li>Apple</li>
    </ul>
    
    <!-- Internal link to another page -->
    <a href="second.html">A path to Another Page</a>
    
    <!-- Image element -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-j1tMItsZgjNHrBRKtRMpWVZALWIeriu7Ag&s" alt="First Name">
</body>
</html>
